<script>
const q = new URLSearchParams(location.search);
const V = (q.get("v") || "A").toUpperCase();
const S = q.get("s") || "phone";
const T = q.get("t") || "dark";
const R = Number(q.get("r") || 22);
document.documentElement.dataset.theme = T;
document.documentElement.dataset.r = String(R);
document.documentElement.style.setProperty("--r", R + "px");
// The TV's radius follows the phone's choice: 22 -> 1.4em (today), 10 -> .55em, 6 -> .35em.
document.documentElement.style.setProperty("--rtv", R >= 20 ? "1.4em" : R >= 9 ? ".55em" : ".35em");
document.body.className = S;

// The team's October as the owner's screenshot showed it (2026-10-29), goals implied by the percentages.
const PEOPLE = [
  { n: "Anersi Koka", i: "AK", tone: "purple", amt: 67515, pol: 44, goal: 70000, today: 0 },
  { n: "Alex Alekseyev", i: "AA", tone: "amber", amt: 50660, pol: 35, goal: 50000, today: 1260 },
  { n: "Moe Karim", i: "MK", tone: "red", amt: 36590, pol: 22, goal: 35000, today: 4424 },
  { n: "Maira Angulo", i: "MA", tone: "blue", amt: 16920, pol: 16, goal: 20000, today: 720 },
  { n: "Tina Kehrig", i: "TK", tone: "purple", amt: 9936, pol: 9, goal: 10000, today: 0 },
  { n: "Matt Fouchey", i: "MF", tone: "green", amt: 8248, pol: 10, goal: 10000, today: 828 },
  { n: "Samantha Marty", i: "SM", tone: "amber", amt: 5232, pol: 5, goal: 10000, today: 0 },
];
const total = PEOPLE.reduce((s, p) => s + p.amt, 0);
const policies = PEOPLE.reduce((s, p) => s + p.pol, 0);
const todayTotal = PEOPLE.reduce((s, p) => s + p.today, 0);
const GOAL = 200000;
const max = Math.max(...PEOPLE.map((p) => p.amt));
const $ = (n) => "$" + Math.round(n).toLocaleString("en-US");
const pct = (p) => Math.round((p.amt / p.goal) * 100);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const smallLine = (p) => `${p.pol} policies${p.today ? ` · <span class="up">+${$(p.today)} today</span>` : ""}`;

function ringSvg(p, r, cls) {
  const c = 2 * Math.PI * r;
  const v = Math.min(100, pct(p));
  return `<svg viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="${r}"/><circle class="p ${pct(p) >= 100 ? "done" : ""}" cx="50" cy="50" r="${r}" stroke-dasharray="${(c * v) / 100} ${c}"/></svg>`;
}

/** One leaderboard row in the chosen variant; the same markup serves the phone and the TV. */
function row(p, idx) {
  const rank = idx + 1;
  const done = pct(p) >= 100;
  const rankHtml = `<span class="rank mono ${rank === 1 ? "g" : ""}">${rank}</span>`;
  const av = `<span class="av ${p.tone}">${p.i}</span>`;
  const name = `<b>${esc(p.n)}</b>`;
  const amt = `<span class="amt mono">${$(p.amt)}</span>`;
  if (V === "A") {
    // Even bars: one track, the same length for everyone; the percent in a fixed box at its end.
    return `${rankHtml}${av}<div class="body"><div class="l1">${name}${amt}</div>
      <div class="bar"><div class="track"><i class="${done ? "done" : ""}" style="width:${Math.min(100, pct(p))}%"></i></div><span class="pct mono ${done ? "done" : ""}">${pct(p)}%</span></div>
      <div class="small l3">${smallLine(p)}</div></div>`;
  }
  if (V === "B") {
    // Rings: progress wraps the avatar; the row stays two lines.
    return `${rankHtml}<span class="ring">${ringSvg(p, 44)}${av}</span><div class="body"><div class="l1">${name}${amt}</div>
      <div class="small" style="margin-top:3px">${pct(p)}% of goal · ${smallLine(p)}</div></div>`;
  }
  if (V === "C") {
    // Percent pill under the amount, colored by how close: green at the goal, the brand tint from 75%, gray below.
    const tone = done ? "green" : pct(p) >= 75 ? "tint" : "gray";
    return `${rankHtml}${av}<div class="body"><div class="l1">${name}</div><div class="small" style="margin-top:3px">${smallLine(p)}</div></div>
      <div class="amtcol">${amt}<span class="pill ${tone}">${done ? "✓ " : ""}${pct(p)}% of goal</span></div>`;
  }
  // D: everyone on the leader's scale, a mark where their own goal sits; the bar turns green once past it.
  const w = (p.amt / max) * 100;
  const g = Math.min(100, (p.goal / max) * 100);
  return `${rankHtml}${av}<div class="body"><div class="l1">${name}${amt}</div>
    <div class="scale"><div class="track"><i class="${done ? "done" : ""}" style="width:${w}%"></i><u style="left:calc(${g}% - 1px)"></u></div><span class="pct mono ${done ? "done" : ""}">${pct(p)}%</span></div>
    <div class="small l3">${smallLine(p)}</div></div>`;
}

const rows = PEOPLE.map((p, i) => `<li class="row ${i === 0 ? "first" : ""}">${row(p, i)}</li>`).join("");

if (S === "phone") {
  document.body.innerHTML = `<div class="screen">
  <div class="nav"><div class="lockup"><div class="mark"><i class="a"></i><i class="b"></i><i class="c"></i><b></b></div><div class="t">Scorecard<small>by TKG</small></div></div><div class="ak">AK</div></div>
  <h1>This month</h1>
  <p class="sub">October 2026 <span class="pill amber">1 business day left</span></p>
  <div class="card goal"><span class="eyebrow">Team production</span>

} else {

      <section class="tiles"><div class="tile"><span class="eyebrow">Today</span><div class="v mono up">${$(todayTotal)}</div><div class="s">5 policies</div></div><div class="tile"><span class="eyebrow">Policies</span><div class="v mono">${policies}</div><div class="s">${$(total / policies)} avg</div></div><div class="tile"><span class="eyebrow">Needed today</span><div class="v mono">${$(GOAL - total)}</div><div class="s">to hit ${$(GOAL)}</div></div></section>
      <section class="panel chart"><div class="ph"><b>The month so far</b><span class="legend"><i class="a"></i>production<i class="b"></i>goal line</span></div>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="0" stroke="var(--line)" stroke-width=".3"/><line x1="0" y1="50" x2="100" y2="50" stroke="var(--line)" stroke-width=".3"/><line x1="0" y1="100" x2="100" y2="0" stroke="var(--chart2)" stroke-width=".7" stroke-dasharray="2 1.5" vector-effect="non-scaling-stroke"/><polyline points="${chartLine}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></section>
      <section class="panel feed"><div class="ph"><b>Latest sales</b></div><ul>
        <li><span class="av red">MK</span><span class="n"><b>Moe</b> · AHL · Whole life</span><span class="t">9:12 AM</span><span class="m mono">$4,424</span></li>
        <li><span class="av amber">AA</span><span class="n"><b>Alex</b> · Americo · Term</span><span class="t">8:58 AM</span><span class="m mono">$1,260</span></li>
        <li><span class="av green">MF</span><span class="n"><b>Matt</b> · Royal · Term</span><span class="t">8:40 AM</span><span class="m mono">$828</span></li>

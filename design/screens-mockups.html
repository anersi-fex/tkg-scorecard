  const goal = Array.from({ length: 30 }, (_, i) => `${X(i + 1)},${Y((200 * biz(i + 1)) / 21)}`).join(" ");
  const line = (arr) => arr.slice(1).map((v, i) => `${X(i + 1)},${Y(v)}`).join(" ");
  const series = withPc ? LIFE_K.map((v, i) => v + PC_K[i]) : LIFE_K;
  const ticks = [1, 5, 10, 15, 20, 25, 30].map((d) => `<span style="position:absolute;left:${X(d)}%;transform:translateX(-50%)">${d}</span>`).join("");
  return `<div style="position:relative;flex:1;min-height:0;margin:.5em 0 0 2.6em">
    <span style="position:absolute;left:-2.6em;top:calc(${Y(200)}% - .55em);font-size:.75em;color:var(--g500);font-weight:600">$200k</span>
    <span style="position:absolute;left:-2.6em;top:calc(${Y(100)}% - .55em);font-size:.75em;color:var(--g500);font-weight:600">$100k</span>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:calc(100% - 1.3em)">
      <line x1="0" y1="${Y(200)}" x2="100" y2="${Y(200)}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <line x1="0" y1="${Y(100)}" x2="100" y2="${Y(100)}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <polyline points="${goal}" fill="none" stroke="var(--chart2)" stroke-width="2" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>
      ${withPc ? `<polyline points="${line(LIFE_K)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-opacity=".35" vector-effect="non-scaling-stroke"/>` : ""}
      <polyline points="${line(series)}" fill="none" stroke="${withPc ? "var(--pc)" : "var(--accent)"}" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <div style="position:absolute;left:0;right:0;bottom:0;height:1.1em;font-size:.75em;color:var(--g500);font-weight:600">${ticks}</div></div>`;
}

// ---------- the TV ----------
const TABS = [["life", "Life", "l"], ["pc", "P&amp;C", "p"], ["total", "Agency total", "t"]];
function header(screen) {
  const tabs = MODE === "static"
    ? TABS.filter(([k]) => k === screen).map(([k, label, dot]) => `<span class="on ${k}"><i class="${dot}"></i>${label}</span>`).join("")
    : TABS.map(([k, label, dot]) => `<span class="${k === screen ? "on " + k : ""}"><i class="${dot}"></i>${label}${k === screen ? `<em style="width:${P}%"></em>` : ""}</span>`).join("");
  return `<header><div class="lockup"><div class="mark"><i class="a"></i><i class="b"></i><i class="c"></i><b></b></div><div class="t">Scorecard<small>by TKG</small></div></div>
    <div class="mid"><b>November 2026</b><div class="screens">${tabs}</div></div>
    <div class="right"><span class="pill amber">8 business days left</span><div class="clockcol"><span class="clock mono">11:48 AM</span><small>Wed, Nov 18</small></div></div></header>`;
}
const footer = `<footer><b>Finish strong. Every policy counts.</b><span>Updated 11:48 AM <span style="margin-left:1em">F full screen</span></span></footer>`;
function ring(parts, label, big) {
  const r = 42, c = 2 * Math.PI * r;
  let acc = 0;
  const arcs = parts.map(([pct, color]) => { acc += pct; return { to: acc, color }; }).reverse()
    .map((a) => `<circle cx="50" cy="50" r="${r}" style="stroke:${a.color}" stroke-linecap="${a.color.includes("pc") ? "butt" : "round"}" stroke-dasharray="${(c * a.to) / 100} ${c}"/>`).join("");
  const defs = PCMODE === "stripes" ? `<defs><pattern id="pcst" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="color-mix(in srgb,var(--accent) 38%,var(--card))"/><rect width="2.5" height="5" fill="var(--accent)"/></pattern></defs>` : "";
  return `<div class="donut"><svg viewBox="0 0 100 100">${defs}<circle class="t" cx="50" cy="50" r="${r}"/>${PCMODE === "stripes" ? arcs.replace(/style="stroke:var\(--pc\)"/, 'style="stroke:url(#pcst)"') : arcs}</svg><div class="c"><b class="mono">${big}</b><small>${label}</small></div></div>`;
}
function feed(title, items) {
  return `<section class="panel feed"><div class="ph"><b>${title}</b></div><ul>${items.map((x) => {
    const p = PEOPLE.find((q) => q.f === x[0]);
    return `<li>${av(p)}<span class="n"><b>${p.f}</b> · ${x[1]}${x[4] ? ` <span class="pill pc">P&amp;C</span>` : ""}</span><span class="t">${x[2]}</span><span class="m mono">${$(x[3])}</span></li>`;
  }).join("")}</ul></section>`;
}
const LIFE_FEED = [["Moe", "AHL · Whole life", "11:42 AM", 2140], ["Alex", "Americo · Term", "10:58 AM", 1260], ["Matt", "Royal · Term", "10:15 AM", 828], ["Tina", "Foresters · Final expense", "Tue", 1120]];
const PC_FEED = [["Maira", "Progressive · Auto", "11:05 AM", 640], ["Anersi", "HOAIC · Home", "Tue", 1480], ["Anersi", "Geico · Umbrella", "Tue", 450], ["Moe", "Obie · Dwelling", "Tue", 800]];
const ALL_FEED = [["Moe", "AHL · Whole life", "11:42 AM", 2140], ["Maira", "Progressive · Auto", "11:05 AM", 640, true], ["Alex", "Americo · Term", "10:58 AM", 1260], ["Matt", "Royal · Term", "10:15 AM", 828]];

function tvLife() {
  const rows = byLife.map((p, i) => `<li class="${i === 0 ? "first" : ""}">${lifeRow(p, i + 1)}</li>`).join("");
  const pct = (LIFE / GOAL) * 100;
  return `${header("life")}<div class="grid">
    <section class="panel"><div class="ph"><b><span class="k l"></span>Life leaderboard</b><small><span class="legend"><i class="tick"></i>goal line today ·</span>annual premium · policies</small></div><ol>${rows}</ol></section>
    <div class="col">
      <section class="panel goalcard">${ring([[pct, "var(--accent)"]], "OF GOAL", Math.round(pct) + "%")}
        <div class="gt"><span class="eyebrow">Life production</span><div class="big mono">${$(LIFE)}</div><div class="of">of ${$(GOAL)}</div><div class="pace">Ahead by ${$(LIFE - EXPECTED)} · on pace for ${$((LIFE / 13) * 21)}</div></div></section>
      <section class="tiles"><div class="tile"><span class="eyebrow">Today</span><div class="v mono up">${$(LIFE_TODAY)}</div><div class="s">3 policies</div></div><div class="tile"><span class="eyebrow">Policies</span><div class="v mono">${LIFE_POL}</div><div class="s">${$(LIFE / LIFE_POL)} avg</div></div><div class="tile"><span class="eyebrow">Needed a day</span><div class="v mono">${$((GOAL - LIFE) / 8)}</div><div class="s">to hit ${$(GOAL)}</div></div></section>
      <section class="panel chart" style="display:flex;flex-direction:column"><div class="ph"><b>The month so far</b><span class="legend"><i class="a"></i>life production<i class="b"></i>goal line</span></div>${chart(false)}</section>
      ${feed("Latest life sales", LIFE_FEED)}
    </div></div>${footer}`;
}
function tvPc() {
  const rows = byPc.map((p, i) => `<li class="${i === 0 ? "first pcf" : ""}">${pcRow(p, i + 1, PC_LEAD)}</li>`).join("");
  const maxPol = Math.max(...CARRIERS.map((c) => c.pol));
  const carriers = CARRIERS.map((c) => `<div class="crow"><div class="top"><b>${c.n}</b><span class="mono"><small>${c.pol} policies</small>${$(c.amt)}</span></div><div class="track"><i style="width:${(c.pol / maxPol) * 100}%"></i></div><div class="small">${c.lines}</div></div>`).join("");
  const lines = LINES.map(([n, pol, amt]) => `<div class="lt"><span class="eyebrow">${n}</span><div class="v mono">${pol}</div><div class="s">${$(amt)}</div></div>`).join("");
  return `${header("pc")}<div class="grid">
    <div class="lcol">
      <section class="panel"><div class="ph"><b><span class="k p"></span>P&amp;C leaderboard</b><small>annual premium · policies · lines</small></div><ol class="fixed">${rows}</ol></section>
      <section class="panel carriers"><div class="ph"><b>By carrier</b><small>November so far</small></div><div class="rows">${carriers}</div></section>
    </div>
    <div class="col">
      <section class="panel goalcard">${PCMODE === "purple" ? `<div class="pcmark">P&amp;C</div>` : `<div class="pcicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 11 5l8 6.5"/><path d="M5 10v8.5h4.5V14h3v4.5H17V10"/><path d="M14.5 20.5h6.8l-.9-2.6a1.2 1.2 0 0 0-1.1-.8h-2.8a1.2 1.2 0 0 0-1.1.8z" fill="currentColor" stroke="none" opacity=".9"/></svg></div>`}
        <div class="gt"><span class="eyebrow">P&amp;C production</span><div class="big mono" style="color:var(--pc-text)">${$(PC)}</div><div class="of">${PC_POL} policies · Anersi, Moe and Maira</div><div class="pace pcp">+${$(PC_TODAY)} today · Maira, Progressive auto</div></div></section>
      <section class="tiles"><div class="tile"><span class="eyebrow">Today</span><div class="v mono up">${$(PC_TODAY)}</div><div class="s">1 policy</div></div><div class="tile pc"><span class="eyebrow">Policies</span><div class="v mono">${PC_POL}</div><div class="s">${$(PC / PC_POL)} avg</div></div><div class="tile pc"><span class="eyebrow">Share of agency</span><div class="v mono">${Math.round((PC / ALL) * 100)}%</div><div class="s">of ${$(ALL)} total</div></div></section>
      <section class="panel"><div class="ph"><b>By line</b><small>policies · annual premium</small></div><div class="linegrid">${lines}</div></section>
      ${feed("Latest P&amp;C sales", PC_FEED.slice(0, 3))}
    </div></div>${footer}`;
}
function tvTotal() {
  const rows = byAll.map((p, i) => `<li class="${i === 0 ? "first" : ""}">${totalRow(p, i + 1)}</li>`).join("");
  const lifePct = (LIFE / GOAL) * 100, pcPct = (PC / GOAL) * 100;
  return `${header("total")}<div class="grid">
    <section class="panel"><div class="ph"><b><span class="k t"></span>Agency leaderboard</b><small><span class="legend"><span class="dot l"></span>life<span class="dot p"></span>P&amp;C<i class="tick"></i>goal line today</span></small></div><ol>${rows}</ol></section>
    <div class="col">
      <section class="panel goalcard">${ring([[lifePct, "var(--accent)"], [pcPct, "var(--pc)"]], "WITH P&amp;C", Math.round(lifePct + pcPct) + "%")}
        <div class="gt"><span class="eyebrow">Agency total · life + P&amp;C</span><div class="big mono">${$(ALL)}</div><div class="of">of the ${$(GOAL)} goal, P&amp;C added</div><div class="splitline"><span><i class="l"></i>Life <b>${$(LIFE)}</b></span><span><i class="p"></i>P&amp;C <b>${$(PC)}</b></span></div><div class="pace">With P&amp;C: ahead by ${$(ALL - EXPECTED)}</div></div></section>
      <section class="tiles"><div class="tile"><span class="eyebrow">Today</span><div class="v mono up">${$(ALL_TODAY)}</div><div class="s">4 policies · 1 P&amp;C</div></div><div class="tile"><span class="eyebrow">Policies</span><div class="v mono">${ALL_POL}</div><div class="s">${LIFE_POL} life · ${PC_POL} P&amp;C</div></div><div class="tile"><span class="eyebrow">Avg premium</span><div class="v mono">${$(ALL / ALL_POL)}</div><div class="s">per policy</div></div></section>
      <section class="panel chart" style="display:flex;flex-direction:column"><div class="ph"><b>The month so far</b><span class="legend"><i class="a" style="opacity:.45"></i>life<i class="b" style="background:var(--pc);margin-left:1em"></i>life + P&amp;C<i class="b"></i>goal line</span></div>${chart(true)}</section>
      ${feed("Latest sales", ALL_FEED)}
    </div></div>${footer}`;
}

// ---------- the phone ----------
const NAV = `<div class="nav"><div class="lockup"><div class="mark"><i class="a"></i><i class="b"></i><i class="c"></i><b></b></div><div class="t">Scorecard<small>by TKG</small></div></div><div class="ak">AK</div></div>`;
const STRIP = `<div class="strip"><div class="tab on"><i></i>This month</div><div class="tab"><i></i>Log a sale</div><div class="tab"><i></i>Wrap</div><div class="tab"><i></i>Team</div></div>`;
function seg(on) {
  return `<div class="seg">${TABS.map(([k, label, dot]) => `<span class="${k === on ? "on" : ""}"><i class="${dot}"></i>${k === "total" ? "Total" : label}</span>`).join("")}</div>`;
}
function phoneTop(on) {
  return `${NAV}<div class="titlerow"><h1>This month</h1><div class="arrows"><span>‹</span><span class="off">›</span></div></div>
  <p class="sub">November 2026 <span class="pill amber">8 business days left</span></p>${seg(on)}`;
}
function phoneLife() {
  const pct = (LIFE / GOAL) * 100;
  const rows = byLife.map((p, i) => `<li class="row">${lifeRow(p, i + 1)}</li>`).join("");
  return `<div class="screen">${phoneTop("life")}
  <div class="card goal"><span class="eyebrow">Life production</span>
    <div class="big mono">${$(LIFE)}<small>of ${$(GOAL)} · <b>${Math.round(pct)}%</b></small></div>
    <div class="track"><i style="width:${pct}%"></i></div>
    <p class="line">Ahead by ${$(LIFE - EXPECTED)}. On pace for ${$((LIFE / 13) * 21)}. ${$((GOAL - LIFE) / 8)} a day for 8 days gets there.</p>
    <div class="stats"><div><span class="eyebrow">Policies</span><div class="v mono">${LIFE_POL}</div></div><div><span class="eyebrow">Avg premium</span><div class="v mono">${$(LIFE / LIFE_POL)}</div></div><div><span class="eyebrow">Today</span><div class="v mono">${$(LIFE_TODAY)}</div></div></div>
  </div>
  <h2>Life leaderboard <small>7</small><span class="legend"><i class="tick"></i>goal line today</span></h2>
  <ul class="list" style="list-style:none;margin:0;padding:0">${rows}</ul>${STRIP}</div>`;
}
function phonePc() {
  const rows = byPc.map((p, i) => `<li class="row ${i === 0 ? "pcf" : ""}">${pcRow(p, i + 1, PC_LEAD)}</li>`).join("");
  const maxPol = Math.max(...CARRIERS.map((c) => c.pol));
  const carriers = CARRIERS.map((c) => `<div class="crow2"><div class="top"><b>${c.n}</b><span><small>${c.pol} policies</small>${$(c.amt)}</span></div><div class="track"><i style="width:${(c.pol / maxPol) * 100}%"></i></div><div class="small">${c.lines}</div></div>`).join("");
  return `<div class="screen">${phoneTop("pc")}
  <div class="card goal pcgoal"><span class="eyebrow">P&amp;C production</span>
    <div class="big mono">${$(PC)}<small>${PC_POL} policies · <b>${$(PC / PC_POL)}</b> avg</small></div>
    <div class="linechips">${LINES.map(([n, pol, amt]) => `<div><span class="eyebrow">${n}</span><div class="v">${pol}</div><div class="s">${$(amt)}</div></div>`).join("")}</div>
    <div class="stats"><div><span class="eyebrow">Today</span><div class="v mono">${$(PC_TODAY)}</div></div><div><span class="eyebrow">Policies</span><div class="v mono">${PC_POL}</div></div><div><span class="eyebrow">Of agency</span><div class="v mono">${Math.round((PC / ALL) * 100)}%</div></div></div>
  </div>
  <h2>P&amp;C leaderboard <small>3</small></h2>
  <ul class="list" style="list-style:none;margin:0;padding:0">${rows}</ul>
  <h2>By carrier <small>5</small></h2>
  <div class="list">${carriers}</div>${STRIP}</div>`;
}
function phoneTotal() {
  const gp = Math.min(100, (ALL / GOAL) * 100);
  const rows = byAll.map((p, i) => `<li class="row">${totalRow(p, i + 1)}</li>`).join("");
  return `<div class="screen">${phoneTop("total")}
  <div class="card goal"><span class="eyebrow">Agency total · life + P&amp;C</span>
    <div class="big mono">${$(ALL)}<small>of ${$(GOAL)} · <b>${Math.round(gp)}%</b> with P&amp;C</small></div>
    <div class="track"><i class="life" style="width:${(gp * LIFE) / ALL}%"></i><i class="pcseg" style="width:${(gp * PC) / ALL}%"></i></div>
    <div class="splitline"><span><i class="l"></i>Life <b>${$(LIFE)}</b></span><span><i class="p"></i>P&amp;C <b>${$(PC)}</b></span></div>
    <p class="line">With P&amp;C added: ahead by ${$(ALL - EXPECTED)}.</p>
    <div class="stats four" style="grid-template-columns:repeat(3,1fr)"><div><span class="eyebrow">Policies</span><div class="v mono">${ALL_POL}</div><div class="s">${LIFE_POL} life · ${PC_POL} P&amp;C</div></div><div><span class="eyebrow">Avg premium</span><div class="v mono">${$(ALL / ALL_POL)}</div><div class="s">per policy</div></div><div><span class="eyebrow">Today</span><div class="v mono">${$(ALL_TODAY)}</div><div class="s">4 policies · 1 P&amp;C</div></div></div>
  </div>
  <h2>Agency leaderboard <small>7</small><span class="legend"><span class="dot l"></span>life<span class="dot p"></span>P&amp;C<i class="tick"></i>goal line</span></h2>
  <ul class="list" style="list-style:none;margin:0;padding:0">${rows}</ul>${STRIP}</div>`;
}
function settings() {
  const ROT = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg>`;
  const DOT = (cls) => `<span style="width:12px;height:12px;border-radius:50%;display:inline-block;background:${cls}"></span>`;
  const CK = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
  const opts = [
    ["Rotate", "Life 60 s, then P&amp;C 15 s, then Agency total 15 s", ROT, "", true],
    ["Life only", "the goal screen, all day", DOT("var(--accent)"), "l"],
    ["P&amp;C only", "P&amp;C sales and the P&amp;C team", DOT("var(--pc)"), "p"],
    ["Agency total only", "life and P&amp;C added up", DOT("linear-gradient(90deg,var(--accent) 50%,var(--pc) 50%)"), ""],
  ];
  return `<div class="screen" style="padding-top:18px;min-height:0;padding-bottom:24px">
    <h2 class="lt">TV screens</h2>
    <p class="d">What the office TV shows. It follows within a few seconds.</p>
    <div class="list">${opts.map(([t, s, ic, cls, on]) => `<div class="opt ${on ? "on" : ""}"><span class="ic ${cls}">${ic}</span><div class="tx"><b>${t}</b><span>${s}</span></div><span class="ck">${on ? CK : ""}</span></div>`).join("")}</div>
  </div>`;
}

if (S === "tv") document.body.innerHTML = `<div class="board">${SCREEN === "pc" ? tvPc() : SCREEN === "total" ? tvTotal() : tvLife()}</div>`;
else if (S === "settings") { document.body.innerHTML = settings(); document.body.style.minHeight = "0"; }
else document.body.innerHTML = SCREEN === "pc" ? phonePc() : SCREEN === "total" ? phoneTotal() : phoneLife();
</script>
</body></html>
